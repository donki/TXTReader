<?xml version="1.0" encoding="UTF-8"?>
<!-- Primer plano: documento de texto blanco con esquina doblada, líneas de texto en
     índigo claro y una insignia "TXT" en índigo (etiqueta de tipo de archivo). -->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">

  <!-- Sombra suave bajo el documento -->
  <ellipse cx="228" cy="352" rx="96" ry="18" fill="#1A1240" opacity="0.18" />

  <!-- Cuerpo del documento -->
  <path d="M140 122
           a24 24 0 0 1 24 -24
           h100
           l52 52
           v168
           a24 24 0 0 1 -24 24
           H164
           a24 24 0 0 1 -24 -24
           Z" fill="#FFFFFF" />

  <!-- Esquina doblada -->
  <path d="M264 98 l52 52 h-40 a12 12 0 0 1 -12 -12 Z" fill="#C3C0FF" />

  <!-- Líneas de texto -->
  <rect x="168" y="150" width="86"  height="13" rx="6.5" fill="#C3C0FF" />
  <rect x="168" y="178" width="120" height="13" rx="6.5" fill="#C3C0FF" />
  <rect x="168" y="206" width="104" height="13" rx="6.5" fill="#C3C0FF" />

  <!-- Insignia "TXT" -->
  <rect x="168" y="244" width="120" height="58" rx="14" fill="#3525CD" />
  <text x="228" y="285" font-family="Arial, Helvetica, sans-serif" font-size="36"
        font-weight="800" text-anchor="middle" fill="#FFFFFF">TXT</text>

</svg>
